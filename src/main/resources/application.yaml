server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: board-gateway
  config:
    additional-location: classpath:/config/
  threads:
    virtual:
      enabled: true
  profiles:
    active: local

front:
  url: ${FRONT_URL}
jwt:
  secret:
    key: ${JWT_SECRET_KEY}